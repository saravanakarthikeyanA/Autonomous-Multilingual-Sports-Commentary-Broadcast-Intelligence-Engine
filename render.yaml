services:
  - type: web
    name: cricket-voice-agent
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_FAST_MODEL
        value: qwen/qwen3.8-27b
      - key: DB_PATH
        value: data/match_stats.db
