name: CI/CD Pipeline - Autonomous Sports Commentary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pytest tests/ -v

  deploy:
    name: Deploy to AWS EC2 (Free Tier)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER != '' && secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            echo "🚀 Starting Deployment on AWS EC2..."
            
            # Navigate to project directory
            if [ ! -d "VoiceAgent" ]; then
              git clone https://github.com/${{ github.repository }}.git VoiceAgent
              cd VoiceAgent
            else
              cd VoiceAgent
              git fetch --all
              git reset --hard origin/main
            fi

            # Set up .env file from GitHub Secrets
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
            echo "GROQ_MODEL=qwen/qwen3.8-27b" >> .env
            echo "GROQ_FAST_MODEL=qwen/qwen3.8-27b" >> .env
            if [ -n "${{ secrets.HF_TOKEN }}" ]; then
              echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> .env
            fi
            echo "DB_PATH=data/match_stats.db" >> .env
            echo "AUDIO_OUTPUT_DIR=data/audio_cache" >> .env
            if [ -n "${{ secrets.MLFLOW_TRACKING_URI }}" ]; then
              echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> .env
            else
              echo "MLFLOW_TRACKING_URI=https://dagshub.com/saravanasmart2001/cricket-voice-agent.mlflow" >> .env
            fi
            if [ -n "${{ secrets.MLFLOW_TRACKING_USERNAME }}" ]; then
              echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> .env
            fi
            if [ -n "${{ secrets.MLFLOW_TRACKING_PASSWORD }}" ]; then
              echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> .env
            fi
            echo "MLFLOW_EXPERIMENT_NAME=${{ secrets.MLFLOW_EXPERIMENT_NAME != '' && secrets.MLFLOW_EXPERIMENT_NAME || 'Cricket_Commentary_Evaluation' }}" >> .env
            if [ -n "${{ secrets.GRAFANA_CLOUD_URL }}" ]; then
              echo "GRAFANA_CLOUD_URL=${{ secrets.GRAFANA_CLOUD_URL }}" >> .env
            else
              echo "GRAFANA_CLOUD_URL=https://merrydogwood2417.grafana.net" >> .env
            fi

            # Initialize database if needed
            if [ ! -f "data/match_stats.db" ]; then
              echo "📊 Initializing SQLite Database..."
              python3 database/db_loader.py || true
            fi

            # Restart containers with Docker Compose
            echo "🐳 Rebuilding & restarting Docker containers..."
            sudo docker compose down --remove-orphans || docker compose down --remove-orphans || true
            sudo docker compose up -d --build || docker compose up -d --build

            echo "✅ Deployment Successful!"
            sudo docker compose ps || docker compose ps
