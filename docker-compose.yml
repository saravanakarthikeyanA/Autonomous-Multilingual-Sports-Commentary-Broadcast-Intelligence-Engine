services:
  app:
    build: .
    container_name: cricket_commentary_app
    ports:
      - "8501:8501"
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - GROQ_FAST_MODEL=${GROQ_FAST_MODEL:-qwen/qwen3.8-27b}
      - HF_TOKEN=${HF_TOKEN:-}
      - DB_PATH=data/match_stats.db
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME:-}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD:-}
      - MLFLOW_EXPERIMENT_NAME=${MLFLOW_EXPERIMENT_NAME:-Cricket_Commentary_Evaluation}
      - GRAFANA_CLOUD_URL=${GRAFANA_CLOUD_URL:-}
    restart: unless-stopped

  # Optional local sidecars (Used only for local testing, offloaded on AWS EC2)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: commentary_prometheus
    profiles:
      - local-monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    container_name: commentary_grafana
    profiles:
      - local-monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - ./monitoring/grafana_provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana_dashboard.json:/var/lib/grafana/dashboards/dashboard.json
    depends_on:
      - prometheus
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: commentary_mlflow
    profiles:
      - local-monitoring
    ports:
      - "5001:5000"
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    volumes:
      - ./data/mlflow:/mlflow
    restart: unless-stopped
